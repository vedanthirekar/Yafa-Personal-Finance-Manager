# Alembic configuration.
#
# The database URL is deliberately NOT set here -- env.py reads it from
# application settings, so there is exactly one place a connection string is
# configured and no risk of alembic.ini and the app disagreeing.

[alembic]
script_location = apps/api/alembic
prepend_sys_path = apps/api
path_separator = os

# Timestamped, slugged filenames sort chronologically and say what they do.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Autogenerated migrations get formatted like the rest of the codebase.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
