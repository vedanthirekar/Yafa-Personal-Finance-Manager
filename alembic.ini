# Alembic configuration.
#
# The database URL is deliberately NOT set here -- env.py reads it from
# application settings, so there is exactly one place a connection string is
# configured and no risk of alembic.ini and the app disagreeing.

[alembic]
script_location = apps/api/alembic
prepend_sys_path = apps/api
path_separator = os

# Timestamped, slugged filenames sort chronologically and say what they do.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Intentionally empty. A ruff post-write hook needs either `ruff` on PATH
# (it isn't, under `python -m alembic` in a venv) or a console_scripts entry
# point (ruff ships a binary and has none). Rather than hardcode a
# platform-specific path, run the normal formatter after autogenerating:
#     uv run ruff format apps/api/alembic/versions
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
